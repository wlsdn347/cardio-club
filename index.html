const date=document.getElementById('date'),search=document.getElementById('search'),list=document.getElementById('list');
const key='cardio-club-progress-v2';
let checked={};try{checked=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
sessions.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.date;date.appendChild(o)});
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const s=sessions[+date.value],query=search.value.trim().toLocaleLowerCase('it');
 document.getElementById('heading').textContent=s.date;
 document.getElementById('subtitle').textContent=s.theme;
 const all=s.docs.flatMap(d=>d.topics),complete=all.filter(t=>checked[t.id]).length;
 document.getElementById('bar').style.width=(complete/all.length*100)+'%';
 document.getElementById('done').textContent=sessions.flatMap(s=>s.docs.flatMap(d=>d.topics)).filter(t=>checked[t.id]).length;
 list.innerHTML='';
 for(const d of s.docs){
  const matchDoc=(d.name+' '+d.id).toLocaleLowerCase('it').includes(query);
  const topics=d.topics.filter(t=>!query||matchDoc||t.title.toLocaleLowerCase('it').includes(query)||t.questions.some(q=>q.toLocaleLowerCase('it').includes(query)));
  if(!topics.length)continue;
  const det=document.createElement('details');det.className='pdf';if(query)det.open=true;
  const count=d.topics.filter(t=>checked[t.id]).length;
  det.innerHTML=`<summary><span class="num">PDF ${d.id}</span><span class="pdfname">${escapeHTML(d.name)}</span><span class="count">${count}/3 completati</span><span class="material-symbols-rounded chev" aria-hidden="true">expand_more</span></summary><div class="topics">${topics.map(t=>`<div class="topic"><input type="checkbox" id="t-${t.id}" data-id="${t.id}" ${checked[t.id]?'checked':''}><div class="topic-body"><label class="topic-title" for="t-${t.id}">${escapeHTML(t.title)}</label><ol class="questions" aria-label="Domande di discussione">${t.questions.map((q,i)=>`<li class="question"><span class="qnum">${i+1}</span><span>${escapeHTML(q)}</span></li>`).join('')}</ol></div></div>`).join('')}</div>`;
  list.appendChild(det);
 }
 if(!list.children.length)list.innerHTML='<div class="empty">Nessun argomento trovato.</div>';
}
list.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]')){checked[e.target.dataset.id]=e.target.checked;try{localStorage.setItem(key,JSON.stringify(checked))}catch(e){};const opened=[...list.querySelectorAll('details')].map(x=>x.open);render();[...list.querySelectorAll('details')].forEach((x,i)=>x.open=opened[i]);}});
date.addEventListener('change',render);search.addEventListener('input',render);
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Vuoi azzerare tutti i progressi?')){checked={};try{localStorage.removeItem(key)}catch(e){}render()}});
render();
</script></body></html>
